<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteTaker · Sign in</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Note Taker</h1>
      <p class="auth-subtitle" id="auth-subtitle">Sign in to your notes</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">Log In</button>
        <button type="button" class="auth-tab" data-mode="signup">Sign Up</button>
      </div>

      <form id="auth-form">
        <input
          type="text"
          id="username"
          placeholder="Username"
          autocomplete="username"
          required
        />
        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button type="submit" id="auth-submit" class="btn btn-primary auth-submit">Log In</button>
      </form>

      <p class="auth-error hidden" id="auth-error"></p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="auth.js"></script>
</body>
</html>
